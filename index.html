<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MYFIN | Rewards & Finance</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
--bg:#080e1c;
--panel:#101c31;
--blue:#258cff;
--cyan:#55b6ff;
--text:#fff;
--muted:#91a5c5;
--border:#203653;
}

body{
font-family:Arial,sans-serif;
background:var(--bg);
color:var(--text);
min-height:100vh;
}

button,input{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.brand{
font-size:25px;
font-weight:800;
letter-spacing:1px;
}

.brand span{color:var(--cyan)}

.primary-btn{
border:0;
background:linear-gradient(110deg,#258cff,#55b6ff);
color:#fff;
padding:13px 22px;
border-radius:10px;
font-weight:bold;
}

.secondary-btn{
background:transparent;
border:1px solid var(--border);
color:#fff;
padding:12px 20px;
border-radius:10px;
}

/* LANDING PAGE */

#landing header{
display:flex;
justify-content:space-between;
align-items:center;
padding:22px 8%;
border-bottom:1px solid #1c2940;
}

.header-links{
display:flex;
align-items:center;
gap:24px;
}

.header-links a{
color:var(--muted);
text-decoration:none;
font-size:14px;
}

.hero{
padding:85px 8% 70px;
max-width:1000px;
}

.hero-tag{
display:inline-block;
color:var(--cyan);
background:#102849;
border:1px solid #1d4b7b;
padding:9px 14px;
border-radius:30px;
font-size:12px;
margin-bottom:25px;
}

.hero h1{
font-size:clamp(38px,7vw,68px);
line-height:1.12;
max-width:750px;
margin-bottom:20px;
}

.hero h1 span{color:var(--cyan)}

.hero p{
color:var(--muted);
font-size:17px;
line-height:1.7;
max-width:590px;
margin-bottom:28px;
}

.hero-buttons{
display:flex;
gap:12px;
flex-wrap:wrap;
}

.landing-features{
padding:20px 8% 80px;
display:grid;
grid-template-columns:repeat(3,1fr);
gap:18px;
}

.feature{
background:var(--panel);
border:1px solid var(--border);
padding:24px;
border-radius:16px;
}

.feature .icon{
font-size:27px;
margin-bottom:15px;
}

.feature h3{margin-bottom:10px}

.feature p{
color:var(--muted);
font-size:13px;
line-height:1.6;
}

footer{
padding:25px 8%;
border-top:1px solid var(--border);
color:var(--muted);
font-size:12px;
}

/* LOGIN SCREEN */

#login{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:25px;
}

.login-container{
width:100%;
max-width:420px;
background:var(--panel);
border:1px solid var(--border);
border-radius:20px;
padding:32px;
box-shadow:0 20px 70px #0006;
}

.login-container .brand{margin-bottom:30px}

.login-container h2{
font-size:27px;
margin-bottom:9px;
}

.login-container>p{
color:var(--muted);
font-size:14px;
line-height:1.6;
margin-bottom:25px;
}

.login-container label{
display:block;
font-size:13px;
margin:17px 0 8px;
color:#dce8fa;
}

.login-container input{
width:100%;
padding:14px;
border-radius:9px;
border:1px solid var(--border);
background:#091426;
color:white;
outline:none;
}

.login-container input:focus{border-color:var(--blue)}

.login-container button{
width:100%;
margin-top:22px;
}

.login-bottom{
text-align:center;
color:var(--muted);
font-size:13px;
margin-top:20px!important;
margin-bottom:0!important;
}

.login-bottom a{
color:var(--cyan);
cursor:pointer;
}

/* DASHBOARD */

#dashboard{
min-height:100vh;
padding-bottom:35px;
}

.dashboard-header{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 7%;
border-bottom:1px solid var(--border);
}

.user-circle{
width:40px;
height:40px;
border-radius:50%;
display:grid;
place-items:center;
background:#1b3d65;
color:var(--cyan);
font-weight:bold;
}

.dashboard-main{
max-width:1100px;
margin:auto;
padding:32px 25px;
}

.welcome-row{
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
margin-bottom:25px;
}

.welcome-row h2{
font-size:25px;
margin-bottom:7px;
}

.welcome-row p{
color:var(--muted);
font-size:13px;
}

.balance-card{
position:relative;
overflow:hidden;
background:linear-gradient(120deg,#123d70,#1264b6 65%,#1888dc);
border:1px solid #398edb;
border-radius:20px;
padding:27px;
margin-bottom:28px;
box-shadow:0 12px 40px #0879df25;
}

.balance-card:after{
content:"";
position:absolute;
width:230px;
height:230px;
border-radius:50%;
background:#72c5ff20;
right:-65px;
top:-100px;
}

.balance-label{
font-size:12px;
letter-spacing:1.5px;
color:#d4eaff;
margin-bottom:15px;
}

.balance-amount{
font-size:clamp(32px,6vw,43px);
font-weight:bold;
margin-bottom:20px;
}

.balance-footer{
display:flex;
justify-content:space-between;
color:#d5eaff;
font-size:12px;
}

.section-title{
font-size:18px;
margin:30px 0 15px;
}

.stats-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:13px;
}

.stat-card{
background:var(--panel);
border:1px solid var(--border);
padding:19px;
border-radius:14px;
}

.stat-card p{
font-size:12px;
color:var(--muted);
margin-bottom:12px;
}

.stat-card h3{font-size:20px}

.actions-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:13px;
}

.action-card{
background:linear-gradient(145deg,#122441,#0d192d);
border:1px solid #23436c;
border-radius:15px;
padding:19px 15px;
text-align:left;
color:white;
min-height:115px;
}

.action-card .action-icon{
font-size:24px;
margin-bottom:13px;
}

.action-card strong{
display:block;
font-size:14px;
margin-bottom:7px;
}

.action-card span{
font-size:11px;
color:var(--muted);
line-height:1.4;
}

.earning-section>p{
color:var(--muted);
font-size:13px;
margin:-5px 0 17px;
}

.earning-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:14px;
}

.earning-card{
background:linear-gradient(145deg,#122441,#0d192d);
border:1px solid #23436c;
border-radius:16px;
padding:19px 15px;
}

.earning-icon{
font-size:25px;
margin-bottom:14px;
}

.earning-card h4{
font-size:15px;
margin-bottom:8px;
}

.earning-card p{
color:var(--muted);
font-size:12px;
line-height:1.5;
margin-bottom:14px;
}

.earning-reward{
color:var(--cyan);
font-weight:bold;
font-size:14px;
}

.activity-card{
background:var(--panel);
border:1px solid var(--border);
border-radius:15px;
padding:20px;
color:var(--muted);
font-size:13px;
line-height:1.7;
}

.notice{
margin-top:22px;
color:#8298b9;
font-size:11px;
line-height:1.6;
}

@media(max-width:700px){
.landing-features{grid-template-columns:1fr}
.stats-grid{grid-template-columns:repeat(2,1fr)}
.actions-grid{grid-template-columns:repeat(2,1fr)}
.header-links a:not(.login-link){display:none}
.hero{padding-top:65px}
.dashboard-main{padding:25px 17px}
}

@media(max-width:380px){
.earning-grid{grid-template-columns:1fr}
.stat-card h3{font-size:17px}
}
</style>
</head>
